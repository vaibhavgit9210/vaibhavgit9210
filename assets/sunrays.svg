<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Vaibhav Kumar">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e8e4f0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8e4f0" stop-opacity="0.14"/>
      <stop offset="1"   stop-color="#e8e4f0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffc46b" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#bd93f9" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffe9c4"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1"   stop-color="#ffd9a0"/>
    </linearGradient>
  </defs>

  <style>
    .rl, .rr { animation: 7s ease-in-out infinite; }
    .rl { animation-name: driftL; }
    .rr { animation-name: driftR; }
    @keyframes driftL {
      0%, 100% { transform: translateX(0);     opacity: 0.15; }
      50%      { transform: translateX(-26px); opacity: 0.9;  }
    }
    @keyframes driftR {
      0%, 100% { transform: translateX(0);    opacity: 0.15; }
      50%      { transform: translateX(26px); opacity: 0.9;  }
    }
    .glow { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 1;    }
    }
    .sway { animation: sway 9s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: translateX(-4px); }
      50%      { transform: translateX(4px);  }
    }
  </style>

  <rect x="1" y="1" width="998" height="238" rx="12" fill="#07060c" stroke="#2a2440" stroke-width="1"/>

  <rect x="40" y="119.5" width="920" height="1" fill="url(#rule)"/>
  <ellipse class="glow" cx="500" cy="120" rx="250" ry="95" fill="url(#glow)"/>

  <!-- left rays: gentle sine waves drifting outward -->
  <g fill="none" stroke="url(#beam)" stroke-width="2" stroke-linecap="round">
    <path class="rl" d="M 60 34 q 25 -8 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0"   style="animation-delay:-0.4s; animation-duration:6.4s"/>
    <path class="rl" d="M 150 58 q 20 6 40 0 t 40 0 t 40 0 t 40 0 t 40 0"           style="animation-delay:-2.1s; animation-duration:7.6s"/>
    <path class="rl" d="M 40 82 q 28 -10 56 0 t 56 0 t 56 0 t 56 0 t 56 0 t 56 0"   style="animation-delay:-4.8s; animation-duration:6.9s"/>
    <path class="rl" d="M 120 104 q 22 7 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0"   style="animation-delay:-1.3s; animation-duration:8.2s"/>
    <path class="rl" d="M 90 136 q 24 -7 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"   style="animation-delay:-5.6s; animation-duration:7.1s"/>
    <path class="rl" d="M 170 160 q 20 8 40 0 t 40 0 t 40 0 t 40 0 t 40 0"          style="animation-delay:-3.0s; animation-duration:6.6s"/>
    <path class="rl" d="M 55 184 q 26 -9 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0"   style="animation-delay:-6.2s; animation-duration:7.9s"/>
    <path class="rl" d="M 140 206 q 19 6 38 0 t 38 0 t 38 0 t 38 0 t 38 0 t 38 0"   style="animation-delay:-2.7s; animation-duration:6.2s"/>
  </g>

  <!-- right rays: mirrored waves -->
  <g fill="none" stroke="url(#beam)" stroke-width="2" stroke-linecap="round">
    <path class="rr" d="M 640 34 q 25 8 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0"    style="animation-delay:-3.4s; animation-duration:7.3s"/>
    <path class="rr" d="M 630 58 q 20 -6 40 0 t 40 0 t 40 0 t 40 0 t 40 0"          style="animation-delay:-0.9s; animation-duration:6.5s"/>
    <path class="rr" d="M 620 82 q 28 10 56 0 t 56 0 t 56 0 t 56 0 t 56 0 t 56 0"   style="animation-delay:-5.1s; animation-duration:8.0s"/>
    <path class="rr" d="M 620 104 q 22 -7 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0"  style="animation-delay:-2.4s; animation-duration:6.8s"/>
    <path class="rr" d="M 620 136 q 24 7 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"   style="animation-delay:-4.2s; animation-duration:7.5s"/>
    <path class="rr" d="M 630 160 q 20 -8 40 0 t 40 0 t 40 0 t 40 0 t 40 0"         style="animation-delay:-1.7s; animation-duration:6.3s"/>
    <path class="rr" d="M 625 184 q 26 9 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0"   style="animation-delay:-6.7s; animation-duration:7.7s"/>
    <path class="rr" d="M 630 206 q 19 -6 38 0 t 38 0 t 38 0 t 38 0 t 38 0 t 38 0"  style="animation-delay:-3.8s; animation-duration:6.1s"/>
  </g>

  <g class="sway">
    <text x="500" y="112" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="42" font-weight="bold" letter-spacing="6" fill="url(#name)">VAIBHAV KUMAR</text>
    <text x="500" y="150" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" letter-spacing="4" fill="#bd93f9" opacity="0.75">वैभव कुमार</text>
    <text x="500" y="182" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="11" letter-spacing="3" fill="#e8e4f0" opacity="0.4">MAKING TOYS THAT THINK</text>
  </g>
</svg>
